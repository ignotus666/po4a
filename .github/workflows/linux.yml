---
# This workflow will build po4a on linux using Module::Build
name: Build on Linux CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'deb-build'
  pull_request:
    branches:
      - 'deb-build'

jobs:
  build-deb:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install Debian build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper dpkg-dev fakeroot

    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b

    - name: Collect Debian artifacts
      run: |
        mkdir -p dist
        find .. -maxdepth 1 -type f \( \
          -name '*.deb' -o \
          -name '*.udeb' -o \
          -name '*.changes' -o \
          -name '*.buildinfo' \
        \) -exec cp {} dist/ \;

    - name: Upload Debian artifacts
      uses: actions/upload-artifact@v4
      with:
        name: po4a-debian-package-${{ github.run_number }}
        path: dist/
        if-no-files-found: error
